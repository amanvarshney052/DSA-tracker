# Server Port
server.port=${PORT:5000}

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/dsa-tracker}

# JWT Properties
jwt.secret=${JWT_SECRET:your_jwt_secret_key_change_this_in_production_use_random_string}
# 24 hours in milliseconds
jwt.expiration=86400000

# Mail Configuration (SMTP)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_EMAIL:your_email@gmail.com}
spring.mail.password=${SMTP_PASSWORD:your_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Jackson Configuration for Date/Time formatting
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
spring.jackson.time-zone=UTC

# Google OAuth Configuration
google.client.id=${GOOGLE_CLIENT_ID:your_google_client_id}
google.client.secret=${GOOGLE_CLIENT_SECRET:your_google_client_secret}
google.redirect.uri=${CALLBACK_URL:http://localhost:5000/api/auth/google/callback}

# Frontend URL configuration
frontend.url=${FRONTEND_URL:http://localhost:3001}
